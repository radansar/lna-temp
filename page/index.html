<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LNA-EVAL — slice-1 test page</title>
  <style>
    body { font: 13px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; margin: 1.4rem; color: #1a1a1a; }
    h1 { font-size: 16px; } code { background: #eef0f2; padding: 1px 4px; border-radius: 3px; }
    button { font: inherit; padding: 4px 10px; }
    pre { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 5px; padding: 10px; overflow: auto; }
    .ok { color: #137333; } .err { color: #b3261e; }
  </style>
</head>
<body>
  <h1>LNA-EVAL — slice-1 test page</h1>
  <p>Origin: <code id="origin"></code> · callback: <code id="cb"></code></p>
  <p><button id="run">Run batch</button> <span id="status"></span></p>
  <pre id="out">(no rows yet)</pre>

  <script type="module">
    import { runBatch } from "./runner.js";

    const qs = new URLSearchParams(location.search);
    window.__lnaConfig = {
      // the public HTTPS callback (observer channel); orchestrator passes it. Null => rows stay in-page.
      callbackUrl: qs.get("callback") || null,
      // RELATIVE so it resolves both locally (/page -> /descriptors) and on raw.githack.com
      // (/user/repo/branch/page -> /user/repo/branch/descriptors).
      batchUrl: qs.get("batch") || "../descriptors/slice1_batch.json",
    };
    // programmatic API (doc 03 §2). __lnaRows/__lnaDone are harvested by the orchestrator over CDP,
    // so a PUBLIC page needs no network callback (which would itself be public->loopback gated).
    window.__lna = { runBatch, version: "slice1/1.0.0" };
    window.__lnaDone = false;
    window.__lnaRows = [];
    window.__lnaError = null;

    document.getElementById("origin").textContent = location.origin;
    document.getElementById("cb").textContent = window.__lnaConfig.callbackUrl || "(none)";

    const out = document.getElementById("out");
    const status = document.getElementById("status");

    async function go() {
      out.textContent = "";
      status.textContent = "running…";
      window.__lnaDone = false; window.__lnaRows = []; window.__lnaError = null;
      const batch = await (await fetch(window.__lnaConfig.batchUrl, { cache: "no-store" })).json();
      const rows = [];
      await runBatch(batch).onRow((row) => {
        rows.push(row);
        window.__lnaRows = rows;                 // exposed for CDP harvest
        out.textContent = rows.map((r) => JSON.stringify(r, null, 2)).join("\n\n");
      }).completed;
      window.__lnaRows = rows;
      window.__lnaDone = true;                    // orchestrator polls this flag
      status.innerHTML = `<span class="ok">done — ${rows.length} row(s)</span>`;
    }

    document.getElementById("run").addEventListener("click", go);
    if (qs.get("autorun") !== "0") go().catch((e) => {
      window.__lnaError = e.message; window.__lnaDone = true;
      status.innerHTML = `<span class="err">${e.message}</span>`;
    });
  </script>
</body>
</html>
